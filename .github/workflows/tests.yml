name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install kymatio captum scikit-learn scipy numpy pandas matplotlib pillow pytest nbformat nbclient ipykernel
          python -m ipykernel install --user --name python3
      - name: Unit tests
        run: pytest -q -m "not slow"
      - name: Notebook end to end (synthetic data)
        run: pytest -q -m slow
